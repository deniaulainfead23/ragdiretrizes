  - question_id: Q09
    title: Dimensão técnica e sociocultural
    question_text: Que equilíbrio existe entre dimensões técnicas da Computação e dimensões sociais, culturais, éticas e humanas da Educação Digital?
    question_type: evidence_retrieval
    analysis_stage: retrieval
    framework: COMPUTING_AND_DIGITAL_EDUCATION
    category_id: C09
    target_scope: country
    target_country: null
    required_metadata:
      - document_id
      - country
      - document_title
      - page_start
      - page_end
      - chunk_id
      - source_text
    expected_output:
      - evidence_id
      - evidence_text
      - source
      - semantic_score
      - evidence_classification
      - validation_status
    evidence_rule: Recuperar evidências de objetivos e competências técnicas e também de dimensões sociais, culturais, éticas ou humanas, permitindo caracterizar sua coexistência no currículo.
    exclusion_rule: Não transformar a recuperação em ranking; registrar evidências para cada dimensão e deixar a síntese comparativa para etapa posterior.
    allow_cross_country_comparison: false
    requires_validated_evidence: false
    notes: Pergunta de recuperação documental aplicada por país.
    version: 3.0

